name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repository checks
        run: npm run check
      - name: Format checks
        run: npm run format:check
      - name: Tests
        run: npm test
